<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- tailwind + DaisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- styles css -->
    <link rel="stylesheet" href="./styles.css">

    <title>Github Issue Tracker | Home</title>
</head>
<body class="bg-[#E4E4E7]">
    <header>
        <div class="navbar bg-base-100 shadow-sm flex justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9">
                    <img src="./assets/github-logo.png" alt="">
                </div>
                <h2 class="font-semibold text-xl">GitHub Issues Tracker</h2>
            </div>

            <div class="flex gap-2">
                <input id="input-search" type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
                <div class="navbar-end">
                    <a id="btn-search" class="btn btn-primary">Search</a>
                </div>
                </div>
            </div>
            </div>
    </header>

    <main>
        <section>
            <!-- bg-[#E4E4E7] -->
             <!-- main 3 buttons to toggle -->
            <div class="flex gap-3 w-11/12 mx-auto mt-8 p-5 rounded-md bg-white">
                <button class="btn btn-soft btn-primary">All</button>
                <button class="btn btn-soft btn-primary">Open</button>
                <button class="btn btn-soft btn-primary">Closed</button>
            </div>

            <!-- status -->
            <div class="flex items-center justify-between w-11/12 mx-auto mt-8 p-5 rounded-md bg-white">
                <!-- logo + status -->
                 <div class="flex items-center">
                    <div class="w-[50px]">
                        <img src="./assets/Aperture.png" alt="">
                    </div>
                    <div>
                        <p class="font-semibold text-[20px]"><span>50</span> Issues</p>
                        <p class="text-[16px] text-[#64748B]">Track and manage your project issues</p>
                    </div>
                 </div>

                 <!-- open and closed color status -->
                  <div class="flex gap-2">
                    <div class="flex gap-1 items-center">
                        <i class="fa-solid fa-circle" style="color: #00a96e;"></i>
                        <p>Open</p>
                    </div>
                    <div class="flex gap-1 items-center">
                        <i class="fa-solid fa-circle" style="color: #A855F7;"></i>
                        <p>Closed</p>
                    </div>
                  </div>
            </div>
        </section>
    </main>
</body>
</html>
