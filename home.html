<head>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- styles css -->
    <link rel="stylesheet" href="./styles.css">

    <title>Github Issue Tracker | Home</title>
</head>
<body class="bg-[#E4E4E7]">
    <header>
        <div class="navbar bg-base-100 shadow-sm flex flex-col gap-2 md:flex-row md:justify-between md:items-center">
            <div class="flex items-center gap-2">
                <div class="w-9">
                    <img src="./assets/github-logo.png" alt="">
                </div>
                <h2 class="font-semibold text-xl">GitHub Issues Tracker</h2>
            </div>

            <div class="flex gap-2">
                <input id="input-search" type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />

                <button id="btn-search" class="btn btn-primary">Search</button>

                </div>
            </div>
    </header>

    <main>
        <!-- main 3 buttons to toggle -->
        <section id="all-btn">
            <!-- bg-[#E4E4E7] -->
            <div class="flex gap-3 w-11/12 mx-auto mt-8 p-5 rounded-md bg-white">
                <!-- NOTE for myself: see here how all is selected initially -->
                <button id="btn-all" class="btn btn-primary">All</button>
                <button id="btn-open" class="btn btn-outline">Open</button>
                <button id="btn-closed" class="btn btn-outline">Closed</button>
            </div>
        </section>

        <!-- status -->
        <section>
            <div class="flex flex-col gap-2 md:flex-row items-center md:justify-between w-11/12 mx-auto mt-8 p-5 rounded-md bg-white">
                <!-- logo + status -->
                <div class="flex items-center">
                    <div class="w-[50px]">
                        <img src="./assets/Aperture.png" alt="">
                    </div>
                    <div>
                        <p class="font-semibold text-[20px]"><span id="issueCount">50</span> Issues</p>
                        <p class="text-[16px] text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>
                
                <!-- open and closed color status -->
                <div class="flex gap-2">
                    <div class="flex gap-1 items-center">
                        <i class="fa-solid fa-circle" style="color: #00a96e;"></i>
                        <p>Open</p>
                    </div>
                    <div class="flex gap-1 items-center">
                        <i class="fa-solid fa-circle" style="color: #A855F7;"></i>
                        <p>Closed</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- loading spinner -->
        <section class="flex justify-center items-center">
            <span id="spinner" class="loading loading-dots loading-xl hidden"></span>
        </section>

        <!-- issues rendering section -->
         <section id="all-issues-container" class="w-11/12 mx-auto mt-6 md:mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
            <!-- demo card -->
            <!-- <div class="card bg-base-100 w-72 shadow-sm">
                <div class="card-body">
                    <div class="badge badge-soft badge-warning text-[12px] font-medium">High</div>
                    <h2 class="font-semibold text-[14px]">Fix navigation menu on mobile devices</h2>
                    <p class="line-clamp-2 text-[12px] text-[#64748B]">The navigation menu doesn't collapse properly on mobile devices...</p>
                    <div class="flex gap-2">

                    <p class="text-[12px] text-[#64748B]">1/15/2024</p>
                </div>
            </div> -->
        </section>

        <!-- modal -->
         <!-- .showModal() -->
          <!-- onclick="my_modal_1" -->
         <!-- Open the modal using ID.showModal() method -->
        <!-- <button onclick="my_modal_1.showModal()" class="btn">open modal</button> -->
        <dialog id="my_modal_1" class="modal">
        <div id="modal-details-container" class="modal-box space-y-2">
            <!-- NOTE: for myself dynamically adding inside displayForModalClick function -->
        </div>
        </dialog>
    </main>

    <!-- js angta -->
     <script src="./scripts/index.js"></script>
